<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Set Charizard #4 | PokéCard Vault</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      color: #ffffff;
      position: relative;
    }

    /* Fixed Background Card Image from /images/ directory */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('images/charizard-base.jpg'); /* Change card image here */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.20; /* 20% opacity */
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    .card-name {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 20px;
      color: #FFCB05;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    /* Standard Button Style */
    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.98); }

    /* Custom Styles for Each eBay Link */
    .btn-1  { background-color: #0064D2; color: #fff; } /* PSA 10 Listing */
    .btn-2  { background-color: #0064D2; color: #fff; } /* PSA 9 Listing */
    .btn-3  { background-color: #0064D2; color: #fff; } /* BGS 9.5 Listing */
    .btn-4  { background-color: #108043; color: #fff; } /* Raw Near-Mint */
    .btn-5  { background-color: #108043; color: #fff; } /* Raw Excellent */
    .btn-6  { background-color: #E06D53; color: #fff; } /* Buy It Now Deal */
    .btn-7  { background-color: #E06D53; color: #fff; } /* Live Auction */
    .btn-8  { background-color: #8A2BE2; color: #fff; } /* Japanese Version */
    .btn-9  { background-color: #333333; color: #fff; } /* Store eBay Profile */
    .btn-10 { background-color: #D97706; color: #fff; } /* Make an Offer */

    /* Home Button */
    .home-btn {
      width: 100%;
      padding: 14px;
      background-color: #ffffff;
      color: #111111;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="images/logo.jpg" alt="Business Logo" class="logo">

    <h1 class="card-name">1st Edition Charizard #4 (Base Set)</h1>

    <div class="links-list">
      <a href="https://www.ebay.com" target="_blank" class="btn btn-1">PSA 10 Gem Mint - eBay</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-2">PSA 9 Mint - eBay</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-3">BGS 9.5 Gem Mint - eBay</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-4">Raw NM Condition - eBay</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-5">Raw LP Condition - eBay</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-6">Buy It Now Listings</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-7">Live eBay Auctions</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-8">Japanese Version - eBay</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-9">Our Official eBay Store</a>
      <a href="https://www.ebay.com" target="_blank" class="btn btn-10">Make an Offer on eBay</a>
    </div>

    <a href="index.html" class="home-btn">← Return to Home</a>
  </div>

</body>
</html>
