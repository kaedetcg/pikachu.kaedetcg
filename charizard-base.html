<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<!-- Image path is set directly on the body tag below -->
<body style="--bg-image: url('images/282 sm-p.webp');">

  <div class="container">
    <!-- Logo Link to Home -->
    <a href="index.html" class="logo-link">
      <img src="images/logo.jpg" alt="Business Logo" class="logo">

          <a href="https://www.ebay.com" target="_blank" class="btn btn-raw">All Raw Cards</a>

          <details>

          <!-- CGC Dropdown -->

            <summary>CGC</summary>

              <a href="https://www.ebay.com" target="_blank" class="btn btn-cgc">CGC PRISTINE 10</a>

        </div>

      <!-- SECTION 3: RETURN HOME -->
