<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mewtwo & Mew GX 282/SM-P | PokéCard Vault</title>
  <!-- Link relative path up 3 levels to root styles.css -->
  <link rel="stylesheet" href="../../../styles.css">
</head>
<!-- Path up 3 levels to access the images/ folder -->
<body style="--bg-image: url('../../../images/sm-p-282.jpg');">

  <div class="container">
    <!-- Logo Link back to Root Landing Page -->
    <a href="../../../index.html" class="logo-link">
      <img src="../../../images/logo.png" alt="Business Logo" class="logo">
    </a>

    <!-- Card Name Header -->
    <h1 class="card-name">Mewtwo & Mew GX #282/SM-P</h1>

    <div class="sections-wrapper">
      
      <!-- SECTION 1: RAW -->
      <div>
        <div class="section-header">
          <span class="section-title-text">Raw</span>
        </div>
        <div class="section-content">
          <a href="https://www.ebay.com" target="_blank" class="btn btn-raw">All Raw Cards</a>
        </div>
      </div>

      <!-- SECTION 2: GRADED -->
      <div>
        <div class="section-header">
          <span class="section-title-text">Graded</span>
        </div>
        <div class="section-content">
          
          <!-- BECKETT Dropdown -->
          <details class="bgs-dropdown">
            <summary>BECKETT</summary>
            <div class="dropdown-content">
              <a href="https://www.ebay.com" target="_blank" class="btn btn-bgs-blacklabel">BLACK LABEL 10</a>
              <a href="https://www.ebay.com" target="_blank" class="btn btn-bgs-pristine">BGS PRISTINE 10</a>
              <a href="https://www.ebay.com" target="_blank" class="btn btn-bgs-all">ALL BGS slabs</a>
            </div>
          </details>

          <!-- PSA Dropdown -->
          <details class="psa-dropdown">
            <summary>PSA</summary>
            <div class="dropdown-content">
              <a href="https://www.ebay.com" target="_blank" class="btn btn-psa-10">PSA GEM MINT 10</a>
              <a href="https://www.ebay.com" target="_blank" class="btn btn-psa-9">PSA MINT 9</a>
              <a href="https://www.ebay.com" target="_blank" class="btn btn-psa-all">ALL PSA slabs</a>
            </div>
          </details>

          <!-- CGC Dropdown -->
          <details class="cgc-dropdown">
            <summary>CGC</summary>
            <div class="dropdown-content">
              <a href="https://www.ebay.com" target="_blank" class="btn btn-cgc-pristine">CGC PRISTINE 10</a>
              <a href="https://www.ebay.com" target="_blank" class="btn btn-cgc-gem">CGC GEM MINT 10</a>
              <a href="https://www.ebay.com" target="_blank" class="btn btn-cgc-all">ALL CGC slabs</a>
            </div>
          </details>

        </div>
      </div>

      <!-- SECTION 3: RETURN HOME -->
      <div class="home-section">
        <a href="../../../index.html" class="home-btn">← RETURN HOME</a>
      </div>

    </div>
  </div>

</body>
</html>
