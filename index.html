f<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokéCard Vault | Inventory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 12px;
    }
    .title {
      font-size: 1.6rem;
      margin-bottom: 24px;
      text-align: center;
      color: #FFCB05; /* Pokémon Yellow */
    }
    
    /* Accordion / Dropdown Styles */
    .era-section {
      width: 100%;
      margin-bottom: 12px;
    }
    details {
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #333;
    }
    summary {
      padding: 16px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      background-color: #252525;
      color: #3B4CCA; /* Pokémon Blue */
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after {
      content: "▼";
      font-size: 0.8rem;
      color: #888;
    }
    details[open] summary::after { content: "▲"; }
    
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }
    .card-btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background-color: #2a2a2a;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      text-align: center;
      border: 1px solid #444;
      transition: background 0.2s;
    }
    .card-btn:active { background-color: #3B4CCA; }
  </style>
</head>
<body>

  <div class="container">
    <img src="images/logo.jpg" alt="Business Logo" class="logo">
    <h1 class="title">PokéCard Vault</h1>

    <div class="era-section">
      <details>
        <summary>Classic Era (1996 - 2000)</summary>
        <div class="card-list">
          <a href="charizard-base.html" class="card-btn">Base Set Charizard #4</a>
          <a href="blastoise-base.html" class="card-btn">Base Set Blastoise #2</a>
        </div>
      </details>
    </div>

    <div class="era-section">
      <details>
        <summary>Neo Era (2000 - 2002)</summary>
        <div class="card-list">
          <a href="lugia-neo.html" class="card-btn">Neo Genesis Lugia #9</a>
        </div>
      </details>
    </div>

    <div class="era-section">
      <details>
        <summary>Modern Era</summary>
        <div class="card-list">
          <a href="umbreon-vmax.html" class="card-btn">Umbreon VMAX Alt Art</a>
        </div>
      </details>
    </div>

  </div>

</body>
</html>
